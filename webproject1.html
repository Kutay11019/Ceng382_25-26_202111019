<!DOCTYPE html>
<html lang="en"> <!-- indicates that the language of the page is English -->
<head>
    <meta charset="UTF-8"> <!-- Ensures proper display of special characters such as Turkish characters -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- It ensures that the page is mobile compatible -->
    <title>Interstellar Menu</title> 
    <style>  
            body { /* I made the general design of my page with Chatgpt */
    margin: 0;
    padding: 0;
    display: flex;
    background: url('interstellargif2.gif') no-repeat center center/cover;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

.container { /* I designed the login box with Chatgpt */
    position: relative;
    width: 230px;
    background: rgba(0, 0, 0, 0.7);
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    color: white;
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
}

input, button { /* I designed username and password buttons with chatgpt */
    display: block;
    width: 90%;
    margin: 10px auto;
    padding: 10px;
    border: none;
    border-radius: 5px;
}

button { /* I designed enter button with chatgpt */
    background: #ff9800;
    color: white;
    cursor: pointer;
}

.saturn { /* I drew an orange circle with chatgpt and created the saturn */
    position: absolute;
    top: 110%;
    left: 38%;
    width: 70px;
    height: 70px;
    background: orange;
    border-radius: 50%;
    box-shadow: 0 0 15px rgba(255, 165, 0, 0.8);
}

.ring { /* With chatgpt, I created a ring around saturn that rotates continuously */
    position: absolute;
    top: 50%;
    left: 50%;
    width: 105px;
    height: 10px;
    background: rgba(255, 165, 0, 0.5);
    border-radius: 50%;
    transform: translate(-50%, -50%) rotate(20deg);
    animation: rotate-ring 3s linear infinite;
}

@keyframes rotate-ring {
    from {
        transform: translate(-50%, -50%) rotate(0deg);
    }
    to {
        transform: translate(-50%, -50%) rotate(360deg);
    }
}

.star { /* With chatgpt, I designed stars with small white dots that constantly move to the right */
    position: absolute;
    top: 10%;
    left: 0x;
    width: 5px;
    height: 5px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 10px white;
    animation: move-star 3s linear infinite;
}

@keyframes move-star {
    from {
        left: 0px;
        opacity: 1;
    }
    to {
        left: 230px; 
        opacity: 0; 
    }
}

    </style>
</head>
<body>
    <div class="background"></div>
    <div class="container">
        <div class="star"></div>
        <div class="star" style="top: 25%; animation-duration: 2s;"></div> <!-- adjusts the position and speed of movement of the stars -->
        <div class="star" style="top: 60%; animation-duration: 4s;"></div> 
        <div class="star" style="top: 78%; animation-duration: 3.5s;"></div> 
        <div class="star" style="top: 93%; animation-duration: 3s;"></div> 
        <div class="form-container">
            <h2 id="form-title">Login</h2>
                <input type="text" placeholder="Username" disabled> <!-- I added username field which is currently disabled with chatgpt -->
                <input type="password" placeholder="Password" disabled> <!-- I added password field which is currently disabled with chatgpt -->
                <button type="button">Enter</button>
                <p class="toggle-text">Don't have an account? <span id="toggle-form">Sign Up</span></p>
        </div>
        <div class="css-art">
            <div class="saturn">
                <div class="ring"></div>
            </div>
        </div>
    </div>
</body>
</html>
