<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Management</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            background: url('interstellargif2.gif') no-repeat center center/cover;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: white;
        }

        .container {
            position: relative;
            width: 300px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        #clock {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        input, button {
            display: block;
            width: 90%;
            margin: 10px auto;
            padding: 10px;
            border: none;
            border-radius: 5px;
        }

        button {
            background: #ff9800;
            color: white;
            cursor: pointer;
        }

        table {
            width: 100%;
            margin-top: 15px;
            border-collapse: collapse;
            table-layout: fixed;
            word-wrap: break-word;
        }

        th, td {
            border: 1px solid white;
            padding: 8px;
            text-align: center;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        td:nth-child(3) {
            max-width: 100px;
            white-space: normal;
        }

        input:hover {
            outline: 3px solid white; /* chatgpt ile mouse geldiğinde input boxların çevresinin beyazlamasını ayarladım */
        }

        tr:hover {
            cursor: pointer;
            background-color: rgba(255, 165, 0, 0.5);
        }

    </style>
</head>
<body>

    <div class="container">
        <div id="clock"></div>
        <h2>Class Information</h2>
        <form id="classForm">
            <input type="text" id="className" placeholder="Class Name" required>
            <input type="number" id="numPeople" placeholder="Number of People" required>
            <input type="text" id="description" placeholder="Description" required>
            <button type="submit">Add Class</button>
        </form>

        <table id="classTable">
            <thead>
                <tr>
                    <th>Class Name</th>
                    <th>Number of People</th>
                    <th>Description</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        function updateClock() {
            const clockElement = document.getElementById("clock");
            const now = new Date();
            const timeString = now.toLocaleTimeString();

            clockElement.textContent = timeString;
        }

        setInterval(updateClock, 1000);
        updateClock();

        document.getElementById("classForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const className = document.getElementById("className").value;
            const numPeople = document.getElementById("numPeople").value;
            const description = document.getElementById("description").value;

            const tableBody = document.querySelector("#classTable tbody");

            const newRow = document.createElement("tr");
            newRow.innerHTML = `<td>${className}</td><td>${numPeople}</td><td>${description}</td>`;
            tableBody.appendChild(newRow);

            document.getElementById("classForm").reset();
        });

        document.querySelector("h2").addEventListener("mouseover", function() {
            this.style.color = "orange"; // chatgpt ile mouse geldiğinde başlık yazısının rengini değiştirdim
        });

        document.querySelector("h2").addEventListener("mouseout", function() {
            this.style.color = "white";
        });

        document.querySelector("#classTable tbody").addEventListener("contextmenu", function(event) {
            event.preventDefault(); // chatgpt ile sağ tık default davranışlarını engelledim
            if (event.target.tagName.toLowerCase() === "td") {
                const row = event.target.parentElement;
                const className = row.cells[0].textContent;
                const numPeople = row.cells[1].textContent;
                const description = row.cells[2].textContent;

                alert(`Class Name: ${className}\nNumber of People: ${numPeople}\nDescription: ${description}`); //chatgpt ile sağ tık yapıldığında alert çıkmasını ayarladım
            }
        });
    </script>

</body>
</html>
