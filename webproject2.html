<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interstellar Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            background: url('interstellargif2.gif') no-repeat center center/cover;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: white;
        }

        .container {
            position: relative;
            width: 250px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .css-art {
            position: absolute;
            bottom: 25%;
            left: 48%;
            transform: translateX(-50%);
        }

        #clock {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        input, button {
            display: block;
            width: 90%;
            margin: 10px auto;
            padding: 10px;
            border: none;
            border-radius: 5px;
        }

        button {
            background: #ff9800;
            color: white;
            cursor: pointer;
        }

        .saturn {
            position: absolute;
            top: 110%;
            left: 38%;
            width: 70px;
            height: 70px;
            background: orange;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(255, 165, 0, 0.8);
        }

        .ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 105px;
            height: 10px;
            background: rgba(255, 165, 0, 0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%) rotate(20deg);
            animation: rotate-ring 3s linear infinite;
        }

        @keyframes rotate-ring {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .star {
            position: absolute;
            width: 5px;
            height: 5px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px white;
            animation: move-star 3s linear infinite;
        }

        @keyframes move-star {
            from { left: 0px; opacity: 1; }
            to { left: 250px; opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="clock"></div>
        <div class="star"></div>
        <div class="star" style="top: 30%; animation-duration: 2s;"></div>
        <div class="star" style="top: 48%; animation-duration: 4s;"></div> 
        <div class="star" style="top: 80%; animation-duration: 3.5s;"></div> 
        <div class="star" style="top: 93%; animation-duration: 3s;"></div>
        <h2 id="form-title">Login</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Enter</button>
        </form>

        <p class="toggle-text">Don't have an account? <span id="toggle-form">Sign Up</span></p>
    </div>
        <div class="css-art">
            <div class="saturn">
                <div class="ring"></div>
            </div>
        </div>

    <script>
        const loginAttempts = [];

        const loginForm = document.getElementById("loginForm");

        loginForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            loginAttempts.push({ username, password });

            console.log("Tüm Girişler:", loginAttempts);

            loginForm.reset();
        });

        function updateClock() {
            const clockElement = document.getElementById("clock");
            const now = new Date();
            const timeString = now.toLocaleTimeString();

            clockElement.textContent = timeString;
        }

        setInterval(updateClock, 1000);

        updateClock();

        document.addEventListener("keydown", function(event) {
            if (event.key.toLowerCase() === "h") {
                const container = document.querySelector(".container");
                container.style.display = (container.style.display === "none") ? "block" : "none";
            }
        });
    </script>

</body>
</html>
